[project]
name = "flight-insights"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["requests>=2.31,<3", "google-cloud-bigquery>=3.25,<4", "pyspark==3.5.5"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
