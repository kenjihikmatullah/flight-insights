name: flight-insights
x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
    OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
    GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    BIGQUERY_DATASET: ${BIGQUERY_DATASET:-flight_insights}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/credentials/google.json
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/flight/src:ro
    - ./logs:/opt/airflow/logs
    - ${GOOGLE_CREDENTIALS_FILE:-./credentials/google.json}:/opt/credentials/google.json:ro
  depends_on:
    postgres:
      condition: service_healthy
  user: '${AIRFLOW_UID:-50000}:0'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command: -c 'airflow db migrate && airflow users create --username admin --password admin --firstname Local --lastname Admin --role Admin --email admin@example.com'
    restart: 'no'
  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ['8080:8080']
  airflow-scheduler:
    <<: *airflow
    hostname: airflow-scheduler
    command: scheduler
  spark-master:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    command: /bin/bash -c '$$SPARK_HOME/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master'
    ports: ['8081:8080']
    volumes:
      - ./src:/opt/flight/src:ro
  spark-worker:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    command: /bin/bash -c '$$SPARK_HOME/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077'
    depends_on: [spark-master]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /opt/credentials/google.json
    volumes:
      - ./src:/opt/flight/src:ro
      - ${GOOGLE_CREDENTIALS_FILE:-./credentials/google.json}:/opt/credentials/google.json:ro
volumes:
  postgres-data:
